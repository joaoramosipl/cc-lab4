services:
  proxy-manager:
    image: 'jc21/nginx-proxy-manager:latest'
    ports:
      - '80:80'
      - '443:443'
      - '81:81'
    volumes:
      - ./data/npm:/data
      - ./data/letsencrypt:/etc/letsencrypt
  frontend:
    build: ./frontend
  api:
    build: ./api
    depends_on:
      - cache-db
  cache-db:
    image: redis